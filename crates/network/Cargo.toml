[package]
name = "opusdm-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "opusdm_network"
path = "src/lib.rs"

[dependencies]
zbus = { version = "5.19.0", features = ["blocking"] }
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
async-channel.workspace = true
opusdm-watch = { path = "../watch" }
dirs.workspace = true
getrandom = "0.2"
base64 = "0.22"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tempfile.workspace = true
