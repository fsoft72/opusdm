[package]
name = "opusdm-theme-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "opusdm-settings"
path = "src/main.rs"

[dependencies]
opusdm-ipc = { path = "../ipc" }
opusdm-themepack = { path = "../themepack" }
opusdm-desktop-config = { path = "../desktop-config" }
opusdm-iconview = { path = "../iconview" }
opusdm-input-config = { path = "../input-config" }
opusdm-network-config = { path = "../network-config" }
opusdm-printer-config = { path = "../printer-config" }
opusdm-bluetooth-config = { path = "../bluetooth-config" }
# Only the editors are used, so the VTE terminal is left out.
opusdm-lister = { path = "../lister", default-features = false }
opusdm-ui = { path = "../ui" }
gtk4.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
zip.workspace = true
tar.workspace = true
flate2.workspace = true
bzip2.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
