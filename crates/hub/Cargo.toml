[package]
name = "opusdm-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "opusdm_hub"
path = "src/lib.rs"

[[bin]]
name = "opusdm-hub"
path = "src/main.rs"

[dependencies]
opusdm-ipc = { path = "../ipc" }
opusdm-ui = { path = "../ui" }
opusdm-fsops = { path = "../fsops" }
opusdm-iconview = { path = "../iconview" }
opusdm-media = { path = "../media" }
opusdm-panel = { path = "../panel" }
opusdm-dock = { path = "../dock" }
opusdm-buttonbank = { path = "../buttonbank" }
opusdm-input-config = { path = "../input-config" }
opusdm-screen = { path = "../screen" }
opusdm-snap = { path = "../snap" }
async-channel.workspace = true
signal-hook.workspace = true
libc.workspace = true
gtk4.workspace = true
x11rb = { version = "0.13", features = ["randr"] }
opusdm-x11 = { path = "../x11" }
opusdm-wayland = { path = "../wayland" }
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
zbus = { version = "5.19.0", features = ["blocking"] }
enumflags2 = "0.7.12"
boa_engine = { version = "0.22", default-features = false }

[dev-dependencies]
tempfile.workspace = true
