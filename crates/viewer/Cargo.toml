[package]
name = "opusdm-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "opusdm-viewer"
path = "src/main.rs"

[dependencies]
opusdm-media = { path = "../media" }
opusdm-media-ui = { path = "../media-ui" }
opusdm-ui = { path = "../ui" }
opusdm-ipc = { path = "../ipc" }
opusdm-archive = { path = "../archive" }
gtk4.workspace = true
async-channel.workspace = true
hayro = "0.8"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
opusdm-highlight = { path = "../highlight" }

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
