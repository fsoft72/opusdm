[package]
name = "opusdm-panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "opusdm_panel"
path = "src/lib.rs"

[dependencies]
opusdm-ui = { path = "../ui" }
opusdm-ipc = { path = "../ipc" }
opusdm-apps = { path = "../apps" }
gtk4.workspace = true
x11rb.workspace = true
opusdm-x11 = { path = "../x11" }
opusdm-wayland = { path = "../wayland" }
libc.workspace = true
async-channel.workspace = true
dirs.workspace = true
serde.workspace = true
zbus = { version = "5.19.0", features = ["blocking"] }
opusdm-devices = { path = "../devices" }
opusdm-audio = { path = "../audio" }
opusdm-network = { path = "../network" }
opusdm-printing = { path = "../printing" }
opusdm-bluetooth = { path = "../bluetooth" }
opusdm-bluetooth-config = { path = "../bluetooth-config" }
opusdm-power = { path = "../power" }
opusdm-brightness = { path = "../brightness" }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
