[package]
name = "opusdm-panel"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "opusdm_panel"
path = "src/lib.rs"

[dependencies]
opusdm-ui = { path = "../ui" }
opusdm-ipc = { path = "../ipc" }
opusdm-dock = { path = "../dock" }
gtk4.workspace = true
gdk4-x11.workspace = true
x11rb.workspace = true
libc.workspace = true
async-channel.workspace = true
dirs.workspace = true
zbus = { version = "5.19.0", features = ["blocking"] }
opusdm-devices = { path = "../devices" }
opusdm-audio = { path = "../audio" }
opusdm-network = { path = "../network" }

[dev-dependencies]
tempfile.workspace = true
