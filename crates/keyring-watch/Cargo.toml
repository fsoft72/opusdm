[package]
name = "opusdm-keyring-watch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "opusdm_keyring_watch"
path = "src/lib.rs"

[[bin]]
name = "opusdm-keyring-watch"
path = "src/main.rs"

[dependencies]
opusdm-ipc = { path = "../ipc" }
zbus = { version = "5.19.0", features = ["blocking"] }
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
getrandom = "0.2"
