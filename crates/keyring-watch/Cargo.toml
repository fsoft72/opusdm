[package]
name = "opusdm-keyring-watch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "opusdm_keyring_watch"
path = "src/lib.rs"

[[bin]]
name = "opusdm-keyring-watch"
path = "src/main.rs"

[dependencies]
opusdm-ipc = { path = "../ipc" }
opusdm-ui = { path = "../ui" }
gtk4.workspace = true
async-channel.workspace = true
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5.19.0", features = ["blocking"] }
libc.workspace = true
secret-service = { version = "5.2", features = ["rt-async-io-crypto-rust"] }
getrandom = "0.2"
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
