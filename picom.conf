# picom configuration for the OpusDM Xephyr sandbox (run-x11.sh).
# Shadows, transparency and fading.

# --- Backend ---
# "xrender" on purpose: with "glx" picom and the GTK4 renderer of the hub both
# use the GPU through the Xephyr -glamor server, and the Vulkan device is lost
# (VK_ERROR_DEVICE_LOST). XRender is still accelerated by glamor in Xephyr.
backend = "xrender";
vsync = false;

# --- Shadows ---
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.55;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-color = "#000000";

# No shadow on desktop-like and transient windows. GTK4 popups (menus) have
# rounded corners and an ARGB margin: picom would draw a rectangular shadow
# that does not follow the corners, so they are excluded.
shadow-exclude = [
    "window_type = 'menu'",
    "window_type = 'popup_menu'",
    "window_type = 'dropdown_menu'",
    "window_type = 'utility'",
    "window_type = 'combo'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'",
    "window_type = 'dnd'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- Transparency ---
inactive-opacity = 0.88;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:window_type = 'menu'",
    "100:window_type = 'popup_menu'",
    "100:window_type = 'dropdown_menu'",
    "100:window_type = 'tooltip'"
];

# --- Fading ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

# --- General ---
detect-client-opacity = true;
detect-rounded-corners = true;
use-damage = true;
