# picom configuration for the OpusDM Xephyr sandbox (run-x11.sh).
# Shadows, transparency and OpenGL acceleration.

# --- Backend ---
# OpenGL rendering (needs GLX on the nested server, provided by Xephyr -glamor).
# Fall back to "xrender" if the GLX backend fails to start.
backend = "glx";
glx-no-stencil = true;
vsync = true;

# --- Shadows ---
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.55;
shadow-offset-x = -12;
shadow-offset-y = -10;
shadow-color = "#000000";

# No shadow on desktop-like and transient windows
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'",
    "window_type = 'dnd'",
    "_GTK_FRAME_EXTENTS@:c"
];

# --- Transparency ---
inactive-opacity = 0.88;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
    "100:window_type = 'menu'",
    "100:window_type = 'popup_menu'",
    "100:window_type = 'dropdown_menu'",
    "100:window_type = 'tooltip'"
];

# --- Fading ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 8;

# --- General ---
detect-client-opacity = true;
detect-rounded-corners = true;
use-damage = true;
