# xdg-desktop-portal backends for the OpusDM session (XDG_CURRENT_DESKTOP
# starts with OpusDM). GTK for everything: there is no wlr backend, and the
# KDE one does not answer outside Plasma, so every GTK app waited 25 s for
# the Settings portal (light/dark) before opening its first window.
[preferred]
default=gtk
org.freedesktop.impl.portal.Inhibit=none
