[workspace]
resolver = "2"
members = ["crates/ipc"]

[workspace.package]
edition = "2021"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
filetime = "0.2"
async-channel = "2.5"
signal-hook = "0.4"
libc = "0.2"
thiserror = "2"
gtk4 = { version = "0.11" }
tempfile = "3"
