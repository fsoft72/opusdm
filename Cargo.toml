[workspace]
resolver = "2"
members = ["crates/ipc", "crates/fsops", "crates/hub", "crates/lister", "crates/ui", "crates/iconview"]

[workspace.package]
edition = "2021"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
filetime = "0.2"
async-channel = "2.5"
signal-hook = "0.4"
libc = "0.2"
thiserror = "2"
gtk4 = { version = "0.10", features = ["v4_10"] }
tempfile = "3"
dirs = "5"
md-5 = "0.10"
