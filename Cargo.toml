[workspace]
resolver = "2"
members = ["crates/ipc", "crates/fsops", "crates/hub", "crates/lister", "crates/ui", "crates/iconview", "crates/desktop-config", "crates/panel", "crates/dock", "crates/apps", "crates/runner", "crates/polkit", "crates/shot", "crates/terminal", "crates/media", "crates/player", "crates/viewer", "crates/media-ui", "crates/theme-config", "crates/buttonbank", "crates/ftp", "crates/themepack", "crates/input-config", "crates/apps-editor", "crates/devices", "crates/audio", "crates/archive", "crates/network", "crates/network-config", "crates/power", "crates/snap", "crates/brightness", "crates/watch", "crates/x11", "crates/screen", "crates/wayland", "crates/notify", "crates/highlight", "xtask"]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"
filetime = "0.2"
async-channel = "2.5"
signal-hook = "0.4"
libc = "0.2"
thiserror = "2"
gtk4 = { version = "0.10", features = ["v4_10"] }
tempfile = "3"
dirs = "5"
md-5 = "0.10"
sha2 = "0.10"
x11rb = "0.13"
gdk4-x11 = "0.10"
gtk4-layer-shell = "0.7"
freedesktop-desktop-entry = { version = "0.8", default-features = false }
zip = "2"
tar = "0.4"
flate2 = "1"
bzip2 = "0.4"
libarchive3-sys = "0.1"
