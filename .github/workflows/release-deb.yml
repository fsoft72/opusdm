name: release-deb

# Builds the opusdm .deb on Ubuntu 26.04 when a version tag is pushed and
# attaches it to the GitHub Release of that tag. "workflow_dispatch" builds the
# package without publishing it (the .deb is kept as a run artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config dpkg-dev file \
            libgtk-4-dev libgtk4-layer-shell-dev libarchive-dev libvte-2.91-gtk4-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev libssl-dev

      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION" >&2; exit 1; }

      - name: Build the .deb
        run: scripts/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opusdm-deb
          path: target/deb/*.deb

      - name: Attach the .deb to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/deb/*.deb

  # Publishes the signed apt repository on GitHub Pages (branch gh-pages).
  # Needs the secret APT_GPG_PRIVATE_KEY: an armored secret key without
  # passphrase (gpg --armor --export-secret-keys <id>).
  apt-repo:
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency: apt-repo
    steps:
      - uses: actions/checkout@v4

      - name: Install apt-utils
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - uses: actions/download-artifact@v4
        with:
          name: opusdm-deb
          path: deb

      - name: Get the current repository content
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apt-repo
          else
            mkdir apt-repo
          fi

      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          [ -n "$APT_GPG_PRIVATE_KEY" ] || { echo "secret APT_GPG_PRIVATE_KEY is not set" >&2; exit 1; }
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"

      - name: Update the repository
        env:
          BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: scripts/build-apt-repo.sh apt-repo deb/*.deb

      # One orphan commit per release: the history would otherwise keep every old .deb
      - name: Publish on gh-pages
        run: |
          cd apt-repo
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "apt repository for $GITHUB_REF_NAME"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
