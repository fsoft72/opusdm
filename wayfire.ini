# Wayfire configuration for OpusDM: the Wayfire counterpart of labwc-rc.xml.
# Only what OpusDM relies on is set, everything else keeps Wayfire's defaults.
# The session script and run-wayland.sh start opusdm-hub on their own; the
# hub then starts the rest of the desktop.

[core]
# ipc and ipc-rules: the panel reads windows, positions and desktops through
# them (crates/wayland/src/wayfire.rs). No wayfire-shell: OpusDM is the shell.
plugins = autostart decoration foreign-toplevel gtk-shell ipc ipc-rules move place resize vswitch window-rules wm-actions xdg-activation
# Four desktops in a row, like labwc's <desktops number="4">.
vwidth = 4
vheight = 1
# The clients draw their own title bars: GTK4 asks Wayfire 0.9 for server
# side decorations and gets them, but the decoration plugin then draws
# nothing, so the windows had no title bar at all. The decoration plugin
# still frames the clients that cannot draw one (XWayland).
preferred_decoration_mode = client
xwayland = true

[autostart]
# No Wayfire panel and background: OpusDM draws its own.
autostart_wf_shell = false
# The command that starts the hub, set by the session script (and by
# run-wayland.sh for its sandbox). Wayfire runs it through the shell.
opusdm = $OPUSDM_HUB

[decoration]
# Close first, on the left.
button_order = close minimize maximize
font = sans-serif 10
title_height = 24
border_size = 2
active_color = #2b2d30ff
inactive_color = #3a3c3fff

[place]
mode = cascade

[move]
enable_snap = true
snap_threshold = 10

[vswitch]
binding_left = <ctrl> <alt> KEY_LEFT
binding_right = <ctrl> <alt> KEY_RIGHT
with_win_left = <shift> <alt> KEY_LEFT
with_win_right = <shift> <alt> KEY_RIGHT
wraparound = true
duration = 200
